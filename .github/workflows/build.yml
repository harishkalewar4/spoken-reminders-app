name: Build debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | while read -r l; do echo "::error::$l"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: SpokenReminders-debug-apk
          path: app/build/outputs/apk/debug/*.apk
